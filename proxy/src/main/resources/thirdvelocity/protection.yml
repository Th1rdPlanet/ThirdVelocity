# ThirdVelocity — protection.yml
# Ранний фильтр соединений, лимиты, уровень атаки и защита соединения.

# Сети, к которым не применяются лимиты, оценка репутации и уровни атаки
# (баны применяются). Сюда добавляют свои сервера, мониторинг и т.п.
trusted-networks:
  - "127.0.0.0/8"
  - "::1/128"

early-filter:
  # Закрывать отклонённые соединения через RST (SO_LINGER=0): не копятся TIME_WAIT.
  reset-connection: true
  # Логирование отклонённых соединений: NONE, SUMMARY (сводка раз в 30 с), EACH (каждое).
  log: SUMMARY
  # Для каких причин вместо молчаливого сброса показать игроку сообщение (MiniMessage из
  # messages.yml → blocked-<причина>). Соединение тогда доходит до входа, поэтому для
  # флуда (rate, concurrency) лучше оставлять сброс. Причины: reputation, attack,
  # concurrency, rate.
  show-message-for: [reputation, attack]

rate-limit:
  # Окно счётчиков подключений (секунды). Лимиты на окно задаются в attack.levels.
  window-seconds: 10
  # Подсеть для лимита «на подсеть».
  subnet-prefix-v4: 24
  subnet-prefix-v6: 48
  # Одновременно открытых соединений с одного IP.
  max-concurrent-per-ip: 8
  # Превысивший лимит IP блокируется на время (иначе отклоняется только лишнее).
  temporary-block: true
  # Эскалация: первая блокировка — первый срок, повторная — следующий и т.д. (последний
  # срок повторяется). Счётчик повторов сбрасывается, если IP не попадался escalation-reset.
  temporary-block-durations: [5m, 1h, 1d]
  escalation-reset: 1d
  # Пингов списка серверов с одного IP за окно.
  status-pings-per-window: 20

# Отправка временных блокировок за флуд в файрвол ядра Linux (nftables), чтобы пакеты
# такого IP отбрасывались до Java. Выключено по умолчанию. Команда выполняется напрямую,
# без shell, раз в секунду одной пачкой: {v} — 4 или 6, {elements} — элементы через запятую,
# каждый по шаблону element ({ip}, {seconds}). Нужны права: CAP_NET_ADMIN у процесса или
# sudo-правило только на эту команду. Набор создаётся заранее, пример:
#   nft add table inet thirdvelocity
#   nft add set inet thirdvelocity flood4 '{ type ipv4_addr; flags timeout; }'
#   nft add set inet thirdvelocity flood6 '{ type ipv6_addr; flags timeout; }'
#   nft add chain inet thirdvelocity input '{ type filter hook input priority -10; }'
#   nft add rule inet thirdvelocity input ip saddr @flood4 tcp dport 25565 drop
#   nft add rule inet thirdvelocity input ip6 saddr @flood6 tcp dport 25565 drop
firewall:
  enabled: false
  command: ["nft", "add", "element", "inet", "thirdvelocity", "flood{v}", "{ {elements} }"]
  element: "{ip} timeout {seconds}s"
  # Для /tv unblock: {ip}, {v}.
  unblock-command: ["nft", "delete", "element", "inet", "thirdvelocity", "flood{v}", "{ {ip} }"]
  max-elements-per-call: 500

network:
  # TCP_DEFER_ACCEPT: ядро ОС не будит прокси, пока клиент не прислал данные (секунды,
  # 0 — выключено). Пустые подключения ботов перестают стоить ресурсов. Только Linux
  # (epoll/io_uring), применяется при запуске.
  defer-accept-seconds: 5

# Кэш ответа на пинг списка серверов во время атаки: ProxyPingEvent и сборка ответа
# выполняются раз в ttl, а не на каждый пинг.
status-cache:
  enabled: true
  minimum-level: LOW
  ttl-millis: 1500

attack:
  # Уровень считается по числу подключений (принятых + отклонённых) за окно.
  window-seconds: 10
  # Сколько секунд должно быть спокойно, чтобы понизить уровень на одну ступень.
  recovery-seconds: 30
  # Нижняя граница уровня: NORMAL, LOW, MEDIUM, STRONG.
  minimum-level: NORMAL
  thresholds:
    low: 150
    medium: 400
    strong: 1000
  # Политика каждого уровня:
  # connections-per-ip / connections-per-subnet — подключений за окно rate-limit;
  # unknown-addresses — что делать с IP, которых раньше не было: ALLOW, FLAG (отметить
  #   подозрительным, Selene покажет CAPTCHA), DENY (не пускать);
  # deny-flagged — не пускать IP с вердиктом FLAG из reputation.yml.
  levels:
    normal: { connections-per-ip: 10, connections-per-subnet: 60, unknown-addresses: ALLOW, deny-flagged: false }
    low: { connections-per-ip: 6, connections-per-subnet: 40, unknown-addresses: FLAG, deny-flagged: false }
    medium: { connections-per-ip: 4, connections-per-subnet: 20, unknown-addresses: FLAG, deny-flagged: true }
    strong: { connections-per-ip: 3, connections-per-subnet: 10, unknown-addresses: DENY, deny-flagged: true }

handshake:
  # Разрешённые адреса подключения (то, что игрок вписал в список серверов).
  # Пусто — любые. Поддерживается *: "*.example.com". Боты часто идут по голому IP.
  allowed-hosts: []
  # Не пускать, если в адресе подключения указан голый IP.
  deny-ip-hosts: false
  # Отвечать на пинги клиентов старше 1.7.
  allow-legacy-ping: true
  # Принимать вход через transfer-пакет (1.20.5+).
  allow-transfer-intent: true

login:
  # Допустимый ник (регулярное выражение).
  name-pattern: "^[A-Za-z0-9_]{3,16}$"
  # Запрещённые ники (регулярные выражения, без учёта регистра).
  denied-names: []
  # Максимум разных ников с одного IP за окно alts.yml → names-per-address-window.
  # 0 — без ограничения.
  max-names-per-address: 0

proxy-protocol:
  # Если в velocity.toml включён haproxy-protocol, PROXY-заголовок принимается только от
  # этих адресов. Иначе любой может подделать свой IP и обойти баны. Пусто — от всех.
  trusted-sources: []

security:
  # Шифровать вход offline-игроков (клиенты 1.20.5+) без обращения к Mojang:
  # пароль и весь трафик не видны при перехвате. Активный MITM это не исключает —
  # ванильный протокол не умеет проверять ключ сервера в offline-режиме.
  encrypt-offline-connections: true
